<!doctype html>
<html lang="ja">
<head>

  <link rel="stylesheet" href="css/app.css">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">

  <!-- iOS Safari は一般的なWeb App Manifestの一部（アイコン選択・ステータスバー等）を
       サポートしないため、Apple独自のmetaタグも併記する（Add to Home Screen対応）。 -->
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="収支管理">
</head>
<body>
  <main id="app"></main>

  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <a href="#/calendar" data-nav-match="/calendar"><span class="nav-icon">📅</span><br>カレンダー</a>
      <a href="#/reports" data-nav-match="/reports"><span class="nav-icon">📊</span><br>収支分析</a>
      <a href="#/shops" data-nav-match="/shops"><span class="nav-icon">🏪</span><br>店舗情報</a>
      <a href="#/machines" data-nav-match="/machines"><span class="nav-icon">🎰</span><br>機種情報</a>
      <a href="#/settings" data-nav-match="/settings"><span class="nav-icon">⚙️</span><br>その他</a>
    </div>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
